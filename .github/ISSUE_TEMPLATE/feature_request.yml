name: Feature Request
description: 提出新功能、改进建议或体验优化想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 功能建议
      description: 请描述你希望增加或改进的功能。
      placeholder: 例如：希望支持按保质期提醒物品。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请说明你会在什么情况下使用这个功能。
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 当前替代方法
      description: 如果现在有临时解决办法，请写在这里；如果没有，可以写“没有”。
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高：影响日常使用，希望优先支持
        - 中：会明显改善体验
        - 低：有会更好
        - 不确定
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 可以补充截图、参考应用、具体想法或其他说明。
    validations:
      required: false
