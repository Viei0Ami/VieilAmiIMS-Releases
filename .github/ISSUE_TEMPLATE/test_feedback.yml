name: Test Feedback
description: 提交测试记录、通过项、发现的问题和整体建议
title: "[Test] "
labels: ["test-feedback"]
body:
  - type: input
    id: test-version
    attributes:
      label: 测试版本
      placeholder: RC1-1.0.02
    validations:
      required: true

  - type: input
    id: test-system
    attributes:
      label: 测试系统
      placeholder: 例如：Windows 11 23H2，笔记本/台式机
    validations:
      required: true

  - type: textarea
    id: test-scope
    attributes:
      label: 测试内容
      description: 请说明你测试了哪些功能或流程。
      placeholder: 例如：安装、首次启动、新增物品、查询、备份恢复。
    validations:
      required: true

  - type: textarea
    id: passed-items
    attributes:
      label: 通过项
      description: 哪些功能表现正常？
    validations:
      required: false

  - type: textarea
    id: found-issues
    attributes:
      label: 发现的问题
      description: 请列出测试中发现的问题。严重问题也可以另外提交 Bug Report。
    validations:
      required: false

  - type: textarea
    id: suggestions
    attributes:
      label: 建议
      description: 对安装、界面、功能、性能或文档有什么建议？
    validations:
      required: false

  - type: dropdown
    id: continue-testing
    attributes:
      label: 是否愿意继续参与测试
      options:
        - 是，愿意继续参与
        - 可以，看时间安排
        - 暂时不方便
    validations:
      required: true
